<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Shield / Watermark Line Gradient -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <!-- Dynamic Animation Effects -->
    <style>
      .pulse-ring {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .wave-line {
        animation: waveMove 8s ease-in-out infinite alternate;
      }
      .node-glow {
        animation: glow 3s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.98); opacity: 0.4; }
        100% { transform: scale(1.02); opacity: 0.8; }
      }
      @keyframes waveMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 200; }
      }
      @keyframes glow {
        0% { opacity: 0.3; }
        100% { opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Glowing Orbs (Dynamic Background) -->
  <rect width="1200" height="400" fill="url(#glowCyan)"/>
  <rect width="1200" height="400" fill="url(#glowPurple)"/>

  <!-- Tech Grid Background -->
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Dynamic Watermark Waveform Lines (Background Art) -->
  <g opacity="0.4" class="wave-line">
    <path d="M -50 300 Q 150 150, 350 280 T 750 200 T 1150 250 T 1300 180" fill="none" stroke="url(#cyanPurple)" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M -50 320 Q 200 220, 400 310 T 800 220 T 1200 290" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M -50 100 Q 300 250, 600 120 T 1100 160" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- Futuristic Watermark & Shield Graphic Elements (Background Right) -->
  <g transform="translate(950, 200)" class="pulse-ring">
    <!-- Concentric Verification Radar -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#C084FC" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="6 6"/>
    
    <!-- Shield Icon Silhouette -->
    <path d="M 0 -50 L 40 -30 V 10 C 40 35, 0 50, 0 50 C 0 50, -40 35, -40 10 V -30 Z" fill="none" stroke="url(#cyanPurple)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lock / Check inside shield -->
    <path d="M -12 2 L -3 11 L 14 -8" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Content / Foreground Container (Guaranteed Foreground Visibility) -->
  <g transform="translate(80, 0)">
    
    <!-- Top Category Tag -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38BDF8" letter-spacing="1">
        🛡️ CURATED AWESOME ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
      Awesome AI Watermark Detection
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
      SaaS Platforms &amp; Open-Source Tools for Synthetic Media Provenance, SynthID &amp; C2PA
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" font-family="sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">🔍 AI Content Detection</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(177, 0)">
        <rect x="0" y="0" width="175" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" font-family="sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">🔒 C2PA Provenance</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(364, 0)">
        <rect x="0" y="0" width="180" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" font-family="sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">✨ Invisible Watermarks</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(556, 0)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" font-family="sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">🤖 Deepfake Forensics</text>
      </g>
    </g>

    <!-- Footer Meta line inside Banner -->
    <text x="0" y="340" font-family="sans-serif" font-size="12" fill="#64748B" font-weight="500">
      MAIN-MAINTAINED BY ISHANDUTTA2007 • UPDATED SEPTEMBER 2026
    </text>
  </g>
</svg>
